apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-service-db
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: self-service-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-service-db
    spec:
      containers:
        - name: self-service-db
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            # General
            - name: DB_HOST
              value: pooler.postgresql
            - name: DB_PORT
              value: "5432"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"

            # Public values
            - name: NEXT_PUBLIC_DB_HOST
              value: postgresql.ssc.jtektrnd.net
            - name: NEXT_PUBLIC_DB_PORT
              value: "5432"
            - name: NEXT_PUBLIC_DB_SSL_MODE
              value: "require"
            - name: NEXT_PUBLIC_PREFIX_DB_NAME_WITH_USERNAME
              value: "yes"
            - name: NEXT_PUBLIC_HELP_URL
              value: https://jtektjp.sharepoint.com/sites/ja_0090/SitePages/Self-service-DB%E3%81%AE%E4%BD%BF%E3%81%84%E6%96%B9.aspx?web=1
            - name: NEXT_PUBLIC_APPS_URL
              value: https://homepage.ssc.jtektrnd.net

          envFrom:
            - secretRef:
                name: self-service-db-es
          resources:
            requests:
              memory: "100Mi"
              cpu: "10m"
            limits:
              memory: "500Mi"
              cpu: "300m"
      imagePullSecrets:
        - name: ecr-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: self-service-db
spec:
  ports:
    - port: 3000
  selector:
    app.kubernetes.io/name: self-service-db
  type: ClusterIP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: self-service-db
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: ssc/eso/self-service-db-cnpg
  target:
    name: self-service-db-es
    creationPolicy: Orphan
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: self-service-db
  annotations:
    alb.ingress.kubernetes.io/success-codes: 200-399

    # TODO: remove once configured at IngressClassParams level
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Self-Service Suite
    gethomepage.dev/name: Self-service DB
    gethomepage.dev/description: Allows users to create databases in PostgreSQL on their own
    gethomepage.dev/icon: http://gitlab.jtektrnd.net/uploads/-/system/project/avatar/2229/self-db.png
spec:
  rules:
    - host: self-service-db.ssc.jtektrnd.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: self-service-db
                port:
                  number: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: self-service-db
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Self-Service Suite
    gethomepage.dev/name: Self-service DB
    gethomepage.dev/description: Allows users to create databases in PostgreSQL on their own
    gethomepage.dev/icon: http://gitlab.jtektrnd.net/uploads/-/system/project/avatar/2229/self-db.png
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - self-service-db.ssc.jtektrnd.net
    - self-service-db-cnpg.ssc.jtektrnd.net
  rules:
    - backendRefs:
        - name: self-service-db
          port: 3000
